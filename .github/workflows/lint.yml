name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Environment
        run: |
          SUDO_AVAIL=$(if command -v sudo > /dev/null; then echo 1; fi)
          echo "SUDO_AVAIL=$SUDO_AVAIL" >> $GITHUB_ENV
      - name: Update repositories
        run: |
          ${SUDO_AVAIL:+sudo} apt-get update
      - name: Install dependencies
        run: |
          ${SUDO_AVAIL:+sudo} apt-get install -y make
      - name: Install shellcheck and shfmt
        uses: taiki-e/install-action@v2
        with:
          tool: shellcheck,shfmt
          fallback: none
      - name: Check the tool versions
        run: |
          shellcheck --version
          shfmt --version
      - name: Lint
        run: make lint
      - name: Check the shell formatting
        if: ${{ !cancelled() }}
        run: make format-check
